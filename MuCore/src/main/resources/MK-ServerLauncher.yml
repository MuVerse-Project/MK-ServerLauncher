#======================================================================
#
#
#         MK-ServerLauncher 应用设置
#
#
#======================================================================
ConfigVersion: 0
#======================================================================
ServerFolder: 'servers'
LogFolder: 'logs'
#======================================================================
SystemMonitorInterval: 3
#======================================================================
MuCorePort: 20040
MuViewPort: 20038
#======================================================================
# MuView 访问令牌(整站鉴权):打开页面时输入一次,之后靠浏览器的会话级存储保持(刷新不掉)。
# 留空 = 用户还没设置:启动时会在内存里生成一次性临时令牌,只在本机打开的登录页展示一次,
# 登录后必须换成自己的令牌(不少于 10 位、不能纯数字),之后才会写回本文件。
# 已经设置过令牌后,更换令牌需要先验证当前令牌。
# 对外部署(域名 / 端口转发 / 反代)请直接在这里填随机长串,临时令牌不会暴露给远程访问。
MuViewAccessToken: ''
#======================================================================
